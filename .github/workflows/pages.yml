name: Deploy cheatsheet
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch MIT-licensed original source
        run: git clone --depth 1 https://github.com/jwl-7/leetcode-cheatsheet.git upstream
      - name: Apply minimal design and mobile navigation
        run: python3 site/patch.py upstream
      - name: Install the actual preview UI
        run: |
          node -e "const fs=require('fs'),z=require('zlib');fs.writeFileSync('/tmp/ui-overrides.tar',z.brotliDecompressSync(Buffer.from(fs.readFileSync('site/ui-overrides.br.txt','utf8').trim(),'base64')))"
          tar -tf /tmp/ui-overrides.tar | head -20
          tar -xf /tmp/ui-overrides.tar -C upstream
          python3 site/normalize.py upstream
      - name: Install and build
        working-directory: upstream
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: upstream/docs
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
